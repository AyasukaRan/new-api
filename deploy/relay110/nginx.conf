worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    server_tokens off;
    underscores_in_headers on;
    client_max_body_size 128m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream relay_app {
        zone relay_app 64k;
        server app:3000 resolve;
        keepalive 32;
    }
    map $http_upgrade $upgrade_connection {
        default upgrade;
        '' '';
    }
    geo $realip_remote_addr $domestic_frpc {
        default 0;
        172.16.0.120/32 1;
    }

    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $upgrade_connection;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";

    server {
        listen 8443;
        location / { proxy_pass http://relay_app; }
    }
    server {
        listen 18443 proxy_protocol;
        set_real_ip_from 172.16.0.120/32;
        real_ip_header proxy_protocol;
        if ($domestic_frpc = 0) { return 403; }
        location / { proxy_pass http://relay_app; }
    }
}
